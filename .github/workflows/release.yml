name: Release & Distribute Aegis-2B

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run Test Suite & Self-Audit
        run: |
          uv run --extra dev --python ${{ matrix.python-version }} pytest -v
          uv run --extra dev --python ${{ matrix.python-version }} aegis audit

  build-and-release:
    name: Build Wheel & Publish Release Assets
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build Wheel, Sdist, Debian Package & SHA-256 Checksums
        run: |
          uv build
          # Build Debian (.deb) package
          PKG_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          mkdir -p deb-pkg/DEBIAN deb-pkg/usr/local/bin deb-pkg/usr/lib/aegis-2b
          cat <<EOF > deb-pkg/DEBIAN/control
          Package: aegis-2b
          Version: ${PKG_VER:-0.3.0}
          Section: utils
          Priority: optional
          Architecture: all
          Maintainer: Mohamed Makhlouf <muhamedomar.g@gmail.com>
          Description: Autonomous Cloud Ops Safety Circuit Breaker using Strands Decider 2B
           Intercepts Boto3 AWS API mutations pre-HTTP.
          EOF
          cp dist/*.whl deb-pkg/usr/lib/aegis-2b/
          cat <<'EOF' > deb-pkg/usr/local/bin/aegis
          #!/usr/bin/env bash
          exec python3 -m aegis.cli "$@"
          EOF
          chmod +x deb-pkg/usr/local/bin/aegis
          dpkg-deb --build deb-pkg "dist/aegis-2b_${PKG_VER:-0.3.0}_all.deb"
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          name: "aegis-2b ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher OIDC)
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aegis-2b
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Clean non-Python artifacts before PyPI upload
        run: rm -f dist/*.deb dist/SHA256SUMS.txt

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
