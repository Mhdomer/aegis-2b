name: CI & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-self-audit:
    name: Pytest (27/27) & 10-Vector Self-Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify CLI version
        run: aegis --version

      - name: Run unit test suite (27 tests)
        run: pytest -v

      - name: Run 10-Vector Security & Fail-Closed Self-Audit
        run: aegis audit

      - name: Verify 3-Tier Router & Terraform IaC Patch Engine
        run: aegis remediate --iac

  sast-and-sonarqube:
    name: SAST (Bandit + Ruff Security + SonarQube)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install SAST scanners (Bandit & Ruff)
        run: |
          python -m pip install --upgrade pip
          pip install bandit ruff

      - name: Run Bandit Python AST Security Scanner
        run: bandit -r aegis patterns -ll

      - name: Run Ruff SAST Security Rules (flake8-bandit)
        run: ruff check aegis patterns --select S --ignore S110,S112

      - name: Run SonarCloud / SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v5

  package-verification:
    name: Build & Verify Wheel/SDist Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Wheel and Source Distribution
        run: |
          pip install build
          python -m build
          ls -lh dist/
          sha256sum dist/*

      - name: Install built Wheel in clean environment & verify CLI
        run: |
          pip install dist/*.whl
          aegis --version
          aegis protect --tool revoke_security_group_ingress --params '{"GroupId":"sg-0123456789","Port":22}' --json
