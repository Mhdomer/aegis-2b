[project]
name = "aegis-2b"
version = "0.1.0"
description = "Sub-Second Safety Circuit Breaker for Autonomous Cloud Ops Agents using Strands Decider 2B & Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patterns", "aegis", "ui", "scenarios", "scripts"]
only-include = [
    "patterns",
    "aegis",
    "ui",
    "scenarios",
    "scripts",
    "aegis_demo.py",
    "aegis.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
    "/patterns",
    "/aegis",
    "/ui",
    "/scenarios",
    "/scripts",
    "/tests",
    "/docs",
    "aegis_demo.py",
    "aegis.yaml",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

