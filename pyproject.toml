[project]
name = "aegis-2b"
version = "0.2.0"
description = "Sub-Second Safety Circuit Breaker for Autonomous Cloud Ops Agents using Strands Decider 2B & Amazon Bedrock"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Mohamed Makhlouf", email = "muhamedomar.g@gmail.com" },
]
keywords = [
    "aws",
    "boto3",
    "botocore",
    "guardrails",
    "strands-decider-2b",
    "cloud-security",
    "devsecops",
    "prompt-injection",
    "bedrock",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "bandit>=1.7.8",
    "mypy>=1.9.0",
]

[project.urls]
Homepage = "https://mhdomer.github.io/aegis-2b/"
Documentation = "https://github.com/Mhdomer/aegis-2b#readme"
Repository = "https://github.com/Mhdomer/aegis-2b"
Issues = "https://github.com/Mhdomer/aegis-2b/issues"
Changelog = "https://github.com/Mhdomer/aegis-2b/releases"

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patterns", "aegis", "ui", "scenarios", "scripts"]
only-include = [
    "patterns",
    "aegis",
    "ui",
    "scenarios",
    "scripts",
    "aegis_demo.py",
    "aegis.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
    "/patterns",
    "/aegis",
    "/ui",
    "/scenarios",
    "/scripts",
    "/tests",
    "/docs",
    "aegis_demo.py",
    "aegis.yaml",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

